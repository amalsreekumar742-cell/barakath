# Heap sized for this machine (~7GB RAM). The Flutter default -Xmx8G exceeds
# total RAM and OOM-crashes the daemon; keep Gradle + the Kotlin daemon within budget.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# Legacy Flutter plugins (e.g. image_compression_flutter) compile Java at 1.8 while
# their Kotlin defaults to the JDK's target, tripping AGP's JVM-target consistency
# check. Their thin wrappers dex fine, so downgrade that check from error to warning.
kotlin.jvm.target.validation.mode=warning
# The pub cache (C:) and this project (D:) can be on different drives; Kotlin's incremental
# compiler cannot relativise paths across drive roots and fails the build. Full Kotlin compiles
# avoid it (plugin sources rarely change, so the cost is negligible).
kotlin.incremental=false
# AGP 9 rejects getDefaultProguardFile('proguard-android.txt') by default; flutter_inappwebview_android
# 1.1.3 (latest stable) still uses it in its own build.gradle. Remove once the plugin is updated.
android.r8.proguardAndroidTxt.disallowed=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
