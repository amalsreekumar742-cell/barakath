name: barakath
description: Barakath — Islamic ecommerce customer mobile app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.6
  firebase_messaging: ^15.1.5
  cloud_functions: ^5.1.3

  # State management
  provider: ^6.1.2

  # Clean Architecture — DI + functional error handling
  get_it: ^8.0.3
  injectable: ^2.5.0
  dartz: ^0.10.1
  equatable: ^2.0.7

  # Routing
  go_router: ^14.6.2

  # Payments
  razorpay_flutter: ^1.3.7

  # UI / assets
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  pin_code_fields: ^8.0.1
  flutter_rating_bar: ^4.0.1
  country_code_picker: ^3.1.0

  # Images
  image_picker: ^1.1.2
  image_cropper: ^8.0.2

  # Formatting / i18n
  intl: ^0.19.0

  # Local storage
  shared_preferences: ^2.3.3

  # Deep links / sharing / launching
  # NOTE: deep-link handling deferred to a later feature. Use the maintained
  # `app_links` package when it's built — uni_links is discontinued and relies on
  # the removed Flutter v1 embedding, so it won't compile against current Flutter.
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Media
  youtube_player_flutter: ^9.1.1
  webview_flutter: ^4.10.0

  # Location / maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Spin & Win reward celebration (Batch 4)
  confetti: ^0.8.0

  # Plain REST — currently only the Razorpay IFSC lookup, which is a public GET
  # and not a Firebase call, so it does not go through cloud_functions.
  http: ^1.2.2

  # Connectivity / app updates
  connectivity_plus: ^6.1.0
  upgrader: ^11.3.0
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generation for injectable DI
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2

  # App icon generation — run `dart run flutter_launcher_icons` after changing
  # the source image or the config below.
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# White-background launcher icon: the flame glyph on a plain white square (no
# more brand-green fill). Source is the existing transparent-background glyph
# already used as the Android adaptive-icon foreground.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"

  # Custom fonts (declare here once font files are added to assets/fonts/):
  # fonts:
  #   - family: Barakath
  #     fonts:
  #       - asset: assets/fonts/Barakath-Regular.ttf
