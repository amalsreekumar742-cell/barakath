# pnpm workspace registration.
# NOTE: apps/app (Flutter/Dart) is intentionally NOT included — it is not part of the JS workspace.
packages:
  - 'apps/admin'
  - 'apps/web'
  - 'packages/*'
  - 'functions'
allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
